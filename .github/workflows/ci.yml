name: Spring Boot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Depodaki Kodları Çek
      uses: actions/checkout@v3

    - name: Java 17 Kurulumu
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Maven ile Paketleme (JAR Oluşturma)
      run: |
        cd backend/gs-spring-boot/complete
        chmod +x mvnw
        ./mvnw clean package

    - name: Docker Hub'a Giriş Yap
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: İmajı İnşa Et ve Docker Hub'a Gönder
      run: |
        cd backend/gs-spring-boot/complete
        docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-spring-app:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-spring-app:latest
