services:
  veritabani:
    image: postgres:15-alpine
    container_name: devops-db
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: gizlisifre
      POSTGRES_DB: devops_projesi
    ports:
      - "5432:5432"
    volumes:
      - pg-verileri:/var/lib/postgresql/data
    networks:
      - devops-agi

  spring-app:
    build: ./backend/gs-spring-boot/complete
    container_name: devops-app
    ports:
      - "9090:8080"
    depends_on:
      - veritabani
    networks:
      - devops-agi

volumes:
  pg-verileri:
    external: true

networks:
  devops-agi:
    external: true
